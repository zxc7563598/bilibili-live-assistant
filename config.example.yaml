server:
  port: 9000
  read_timeout: 15
  write_timeout: 15
  idle_timeout: 60

database:
  driver: mysql # 数据库驱动：mysql | postgres | sqlite
  mysql: # mysql 数据库配置（不使用可不进行配置）
    host: 127.0.0.1
    port: 3306
    user: user
    password: password
    dbname: databasename
  # postgres: # postgres 数据库配置（不使用可不进行配置）
  #   host: 127.0.0.1
  #   port: 5432
  #   user: user
  #   password: password
  #   dbname: databasename
  # sqlite: # sqlite 数据库配置（不使用可不进行配置）
  #   filepath: data.db # 数据库文件路径，相对路径相对于二进制所在目录

pool:
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 3600
  conn_max_idle_time: 1800

# redis: # redis 配置（不使用可不进行配置）
#   host: 127.0.0.1
#   port: 6379
#   password:
#   db: 0
#   pool_size: 20
#   min_idle_conns: 5

jwt: # jwt 配置
  secret: "your-secret-at-least-32-characters-long!!"
  access_ttl: 7200
  refresh_ttl: 604800

cors: # CORS 跨域配置
  allowed_origins: [] # 允许的前端来源列表，为空时允许所有来源
  # allowed_origins:
  #   - "http://localhost:5173"
  #   - "https://your-domain.com"

altcha: # altcha 验证码配置
  hmac_key: "your-secret-at-least-32-characters-long!!"

crypto: # 商城请求加密配置
  sign_secret: "your-secret-at-least-32-characters-long!!" # 请求加密 HMAC 签名密钥，必须与前端 shop/.env 中 VITE_SIGN_SECRET 保持一致，生产环境务必修改
  timestamp: 60 # 请求时间偏差窗口（秒），用户请求数据中携带的时间与服务器时间误差超过此设置时视为重放攻击
  require_encryption: false # 是否强制请求体必须加密（仅全 HTTPS 部署可置 true，纯 HTTP 部署必须保持 false）

live: # B站 直播监听配置
  state_file: "bilibili_state.json" # B站 Cookie 持久化文件路径
  test_uids: [] # 测试机器人 UID 白名单，命中的机器人只记录日志不真正发送弹幕（可为空）
