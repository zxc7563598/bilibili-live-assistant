server: # 服务配置
  port: 25443 # 服务监听端口，可用启动参数 -port 覆盖
  read_timeout: 15 # 读取请求超时（秒）
  write_timeout: 15 # 写出响应超时（秒）
  idle_timeout: 60 # 空闲连接保持时间（秒）

database: # 数据库配置
  driver: sqlite # 数据库驱动：mysql | postgres | sqlite
  # mysql: # mysql 数据库配置（不使用可不进行配置）
  #   host: 127.0.0.1 # 数据库地址
  #   port: 3306 # 数据库端口
  #   user: user # 数据库用户名
  #   password: password # 数据库密码
  #   dbname: databasename # 数据库名，不存在时自动创建
  # postgres: # postgres 数据库配置（不使用可不进行配置）
  #   host: 127.0.0.1 # 数据库地址
  #   port: 5432 # 数据库端口
  #   user: user # 数据库用户名
  #   password: password # 数据库密码
  #   dbname: databasename # 数据库名，不存在时自动创建
  sqlite: # sqlite 数据库配置（不使用可不进行配置）
    filepath: data.db # 数据库文件路径，相对路径相对于配置文件所在目录

pool: # 数据库连接池配置（仅 mysql / postgres 生效，sqlite 固定为单个连接）
  max_open_conns: 25 # 最大打开连接数
  max_idle_conns: 10 # 最大空闲连接数
  conn_max_lifetime: 3600 # 连接最长存活时间（秒），到期后重建
  conn_max_idle_time: 1800 # 连接最长空闲时间（秒），超时后关闭

# redis: # redis 配置（用于登录态单点校验，不使用可不进行配置，留空则跳过该校验）
#   host: 127.0.0.1 # redis 地址
#   port: 6379 # redis 端口
#   password: # redis 密码，无密码留空
#   db: 0 # 库编号
#   pool_size: 20 # 连接池最大连接数
#   min_idle_conns: 5 # 连接池保持的最小空闲连接数

jwt: # jwt 配置
  secret: "your-secret-at-least-32-characters-long!!" # 需要替换为32位的随机字母或数字内容
  access_ttl: 7200 # 访问令牌有效期（秒）
  refresh_ttl: 604800 # 刷新令牌有效期（秒）

cors: # CORS 跨域配置
  allowed_origins: [] # 允许的前端来源列表，为空时允许所有来源
  # allowed_origins:
  #   - "http://localhost:5173"
  #   - "https://your-domain.com"

altcha: # altcha 验证码配置（留空则可以不启用验证码）
  hmac_key: "your-secret-at-least-32-characters-long!!" # 需要替换为32位的随机字母或数字内容

crypto: # 商城请求加密配置
  sign_secret: "your-secret-at-least-32-characters-long!!" # 请求加密 HMAC 签名密钥，需要替换为32位的随机字母或数字内容，必须与前端 shop/.env 中 VITE_SIGN_SECRET 保持一致，生产环境务必修改
  timestamp: 60 # 请求时间偏差窗口（秒），用户请求数据中携带的时间与服务器时间误差超过此设置时视为重放攻击
  require_encryption: false # 是否强制请求体必须加密（仅全 HTTPS 部署可置 true，纯 HTTP 部署必须保持 false）

live: # B站 直播监听配置
  state_file: "bilibili_state.json" # B站 Cookie 持久化文件路径
  test_uids: [] # 测试机器人 UID 白名单，命中的机器人只记录日志不真正发送弹幕（可为空）

file: # 文件存储配置
  upload_dir: uploads # 上传图片落盘目录（对外访问前缀固定为 /uploads）。相对路径以本配置文件所在目录为基准，也可填绝对路径

log: # 日志配置
  dir: logs # 日志根目录，业务模块日志按模块名在其下建子目录，Gin 访问日志、标准库输出、GORM 慢 SQL 分别落在 gin/、stdlog/、gorm/

export: # 数据导出配置
  max_rows: 5000000 # 单次导出行数上限，超出直接拒绝并提示缩小筛选范围
  max_concurrent: 2 # 同时进行的导出数上限
  batch_size: 10000 # 分块扫描的每块行数，越大查询次数越少、单次内存占用越高
  ticket_ttl: 120 # 下载凭证有效期（秒）
  max_duration: 600 # 单次导出墙钟上限（秒）
  write_idle_timeout: 30 # 客户端写空闲上限（秒），每写一块续期一次

# 说明：database.sqlite.filepath、live.state_file、file.upload_dir、log.dir 的相对路径
# 都以本配置文件所在目录为基准解析，不受启动时工作目录影响。
# 例如配置文件在 /opt/app/config.yaml，upload_dir 填 uploads，实际落盘到 /opt/app/uploads。
