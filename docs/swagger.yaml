basePath: /
definitions:
  input.AdConfigReq:
    properties:
      content:
        description: 发送内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      interval:
        description: 发送间隔, 秒
        example: "62"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      send_mode:
        description: 发送方式, 0-随机发送, 1-顺序发送
        example: "0"
        type: string
    required:
    - content
    - enabled
    - interval
    - scene
    - send_mode
    type: object
  input.AdminChangePasswordReq:
    properties:
      newPassword:
        description: 新密码
        example: "654321"
        maxLength: 32
        minLength: 6
        type: string
      oldPassword:
        description: 旧密码
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  input.AdminDeleteReq:
    properties:
      id:
        description: 管理员ID
        example: 2
        type: integer
    required:
    - id
    type: object
  input.AdminListPageReq:
    properties:
      enable:
        description: 是否启用
        enum:
        - 0
        - 1
        example: 1
        type: integer
      gender:
        description: 性别
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      pageNo:
        description: 页码
        example: 1
        type: integer
      pageSize:
        description: 每页展示条数
        example: 20
        type: integer
      username:
        description: 用户名，支持模糊搜索
        example: admin
        type: string
    required:
    - pageNo
    - pageSize
    type: object
  input.AdminLoginReq:
    properties:
      captcha:
        description: 验证码
        type: string
      password:
        description: 密码
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
      username:
        description: 账号
        example: admin
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  input.AdminRefreshReq:
    properties:
      token:
        description: refresh token
        example: Bearer xxxxxxxxxx
        type: string
    required:
    - token
    type: object
  input.AdminResetAdminPasswordReq:
    properties:
      id:
        description: 管理员ID
        example: 1
        type: integer
      password:
        description: 密码
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
    required:
    - id
    - password
    type: object
  input.AdminSaveReq:
    properties:
      enable:
        description: 状态
        example: true
        type: boolean
      id:
        description: 管理员ID
        example: 1
        type: integer
      password:
        description: 密码
        example: "123456"
        type: string
      roleIds:
        description: 角色ID组
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      username:
        description: 账号
        example: admin
        minLength: 1
        type: string
    required:
    - username
    type: object
  input.AdminSwitchRoleReq:
    properties:
      code:
        description: 角色标识
        example: SUPER_ADMIN
        type: string
    required:
    - code
    type: object
  input.AdminUpdateProfileReq:
    properties:
      address:
        description: 居住地址
        example: xxxxxxx
        type: string
      avatar:
        description: 头像地址
        example: https://cdn.hejunjie.life/avatars/oneadmin.jpeg
        type: string
      email:
        description: email
        example: xxxxx@xxx.com
        type: string
      gender:
        description: 性别
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      id:
        description: 管理员ID
        example: 1
        type: integer
      nickName:
        description: 名称
        example: test name
        type: string
    required:
    - id
    type: object
  input.FollowConfigReq:
    properties:
      content:
        description: 感谢内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      requirement:
        description: 感谢门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
    required:
    - content
    - enabled
    - requirement
    - scene
    type: object
  input.GiftConfigReq:
    properties:
      content:
        description: 感谢内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      include_blindbox:
        description: 盲盒统计, 0-禁用, 1-启用
        example: "1"
        type: string
      merge_gift:
        description: 礼物合并, 0-禁用, 1-启用
        example: "1"
        type: string
      min_battery:
        description: 起始感谢电池数
        example: "10"
        type: string
      requirement:
        description: 答谢门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      show_count:
        description: 展示数量, 0-禁用, 1-启用
        example: "1"
        type: string
    required:
    - content
    - enabled
    - include_blindbox
    - merge_gift
    - min_battery
    - requirement
    - scene
    - show_count
    type: object
  input.LiveQRCodePollReq:
    properties:
      qrcodeKey:
        description: 扫码登录密钥
        example: xxxxxxxxxxxxxxxxxxxx
        type: string
    required:
    - qrcodeKey
    type: object
  input.LiveRoomUpdateReq:
    properties:
      roomId:
        description: 房间ID
        example: 22384516
        minimum: 1
        type: integer
    required:
    - roomId
    type: object
  input.MenuButtonsReq:
    properties:
      parentId:
        description: 菜单ID（作为父级ID进行查询）
        example: 0
        type: integer
    required:
    - parentId
    type: object
  input.MenuDeleteReq:
    properties:
      id:
        description: 菜单ID
        example: 1
        type: integer
    required:
    - id
    type: object
  input.MenuSaveReq:
    properties:
      code:
        description: 菜单标识
        example: Base
        minLength: 1
        type: string
      component:
        description: 组件路径
        example: /src/list/list.vue
        type: string
      enable:
        description: 状态
        example: true
        type: boolean
      icon:
        description: 菜单图标
        example: i-fe:list
        type: string
      id:
        description: 菜单ID
        example: 1
        type: integer
      keepAlive:
        description: 保持活跃
        example: false
        type: boolean
      layout:
        description: 布局
        example: full
        type: string
      name:
        description: 菜单名称
        example: 基础菜单
        minLength: 1
        type: string
      order:
        description: 排序（从小到大）
        example: 0
        type: integer
      parentId:
        description: 父级ID
        example: 0
        type: integer
      path:
        description: 菜单路径
        example: /path/url
        type: string
      show:
        description: 显示状态
        example: true
        type: boolean
      type:
        description: 菜单类型
        enum:
        - BUTTON
        - MENU
        example: MENU
        minLength: 1
        type: string
    required:
    - code
    - name
    - type
    type: object
  input.MenuToggleReq:
    properties:
      id:
        description: 菜单ID
        example: 1
        type: integer
    required:
    - id
    type: object
  input.MenuValidateReq:
    properties:
      path:
        description: 菜单路径
        example: /path/url
        minLength: 1
        type: string
    required:
    - path
    type: object
  input.PkConfigReq:
    properties:
      content:
        description: 发送内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
    required:
    - content
    - enabled
    type: object
  input.ReplyConfigReq:
    properties:
      content:
        description: 回复内容（JSON 配置）
        items:
          $ref: '#/definitions/input.ReplyItem'
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      requirement:
        description: 触发门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
    required:
    - content
    - enabled
    - requirement
    - scene
    type: object
  input.ReplyItem:
    properties:
      keyword:
        description: 触发关键词列表
        example:
        - 你好
        - 在吗
        items:
          type: string
        type: array
      mute_duration:
        description: 禁言时长（分钟）, 0 表示永久
        example: "10"
        type: string
      mute_sender:
        description: 是否禁言发送者, 0-否, 1-是
        example: "0"
        type: string
      ransom_amount:
        description: 赎回金额（解除禁言需要赠送的电池数）, 0 表示不可赎回
        example: "1000"
        type: string
      reply_content:
        description: 回复内容列表
        example:
        - 欢迎来到直播间
        - 在哦在哦
        items:
          type: string
        type: array
      safe_word:
        description: 安全词列表（包含则不触发）
        example:
        - 骗子
        - 哎呀
        items:
          type: string
        type: array
    type: object
  input.RoleAddRoleUsersReq:
    properties:
      adminIds:
        description: 管理员ID（支持多个）
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      roleId:
        description: 角色ID
        example: 2
        type: integer
    required:
    - adminIds
    - roleId
    type: object
  input.RoleDeleteReq:
    properties:
      id:
        description: 角色ID
        example: 2
        type: integer
    required:
    - id
    type: object
  input.RoleListPageReq:
    properties:
      enable:
        description: 状态
        enum:
        - 0
        - 1
        example: 1
        type: integer
      name:
        description: 名称，支持模糊搜索
        example: 超级
        type: string
      pageNo:
        description: 页码
        example: 1
        type: integer
      pageSize:
        description: 每页展示条数
        example: 20
        type: integer
    required:
    - pageNo
    - pageSize
    type: object
  input.RoleRemoveRoleUsersReq:
    properties:
      adminIds:
        description: 管理员ID（支持多个）
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      roleId:
        description: 角色ID
        example: 2
        type: integer
    required:
    - adminIds
    - roleId
    type: object
  input.RoleSaveReq:
    properties:
      code:
        description: 角色标识
        example: TestAdmin
        type: string
      enable:
        description: 状态
        example: true
        type: boolean
      id:
        description: 角色ID
        example: 2
        type: integer
      name:
        description: 角色名称
        example: 测试管理员
        type: string
      permissionIds:
        description: 角色绑定菜单ID
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  input.RoomConfigReq:
    properties:
      isListening:
        description: 是否默认监听直播间, 0-否, 1-是
        example: "1"
        type: string
      maxNameLength:
        description: 用户名最大长度, 超过此长度则裁剪
        example: "8"
        type: string
      nameTrimMode:
        description: 裁剪方式, 0-省略后面, 1-省略前面
        example: "0"
        type: string
    required:
    - isListening
    - maxNameLength
    - nameTrimMode
    type: object
  input.SendDanmuReq:
    properties:
      message:
        example: 发送弹幕信息
        maxLength: 40
        minLength: 1
        type: string
    required:
    - message
    type: object
  input.ShareConfigReq:
    properties:
      content:
        description: 感谢内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      requirement:
        description: 感谢门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
    required:
    - content
    - enabled
    - requirement
    - scene
    type: object
  input.SignConfigReq:
    properties:
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      fail_reply:
        description: 签到失败回复（JSON 数组字符串）
        items:
          type: string
        type: array
      keyword:
        description: 签到关键词
        example: '#签到'
        type: string
      query_keyword:
        description: 查询关键词
        example: '#查询'
        type: string
      query_reply:
        description: 查询成功回复（JSON 数组字符串）
        items:
          type: string
        type: array
      repeat_reply:
        description: 重复签到回复（JSON 数组字符串）
        items:
          type: string
        type: array
      requirement:
        description: 触发门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      reward_amount:
        description: 奖励数量, 正整数
        example: "10"
        type: string
      reward_type:
        description: 奖励类型, 0-星光, 1-积分
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      success_reply:
        description: 签到成功回复（JSON 数组字符串）
        items:
          type: string
        type: array
    required:
    - enabled
    - fail_reply
    - keyword
    - query_keyword
    - query_reply
    - repeat_reply
    - requirement
    - reward_amount
    - reward_type
    - scene
    - success_reply
    type: object
  input.WelcomeConfigReq:
    properties:
      content:
        description: 欢迎内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      requirement:
        description: 欢迎门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
    required:
    - content
    - enabled
    - requirement
    - scene
    type: object
  resp.AdConfigResp:
    properties:
      content:
        description: 发送内容
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      interval:
        description: 发送间隔, 秒
        example: "62"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      send_mode:
        description: 发送方式, 0-随机发送, 1-顺序发送
        example: "0"
        type: string
    type: object
  resp.AdminCaptchaResp:
    properties:
      enabled:
        description: 是否启用验证码
        example: true
        type: boolean
    type: object
  resp.AdminDetailsProfileItem:
    properties:
      address:
        description: 居住地址
        example: xxxxxxx
        type: string
      avatar:
        description: 头像
        example: https://cdn.hejunjie.life/avatars/oneadmin.jpeg
        type: string
      email:
        description: email
        example: xxxxx@xxx.com
        type: string
      gender:
        description: 性别
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      id:
        description: 管理员ID
        example: 1
        type: integer
      nickName:
        description: 名称
        example: test name
        type: string
    type: object
  resp.AdminDetailsResp:
    properties:
      createdAt:
        description: 创建时间
        example: "2026-03-25 12:00:00"
        type: string
      currentRole:
        allOf:
        - $ref: '#/definitions/resp.AdminDetailsRoleItem'
        description: 当前角色信息
      enable:
        description: 状态
        example: true
        type: boolean
      id:
        description: 管理员ID
        example: 1
        type: integer
      profile:
        allOf:
        - $ref: '#/definitions/resp.AdminDetailsProfileItem'
        description: 个人资料
      roles:
        description: 拥有角色列表
        items:
          $ref: '#/definitions/resp.AdminDetailsRoleItem'
        type: array
      updatedAt:
        description: 更新时间
        example: "2026-03-25 12:00:00"
        type: string
      username:
        description: 账号
        example: admin
        type: string
    type: object
  resp.AdminDetailsRoleItem:
    properties:
      code:
        description: 角色标识
        example: SUPER_ADMIN
        type: string
      enable:
        description: 状态
        example: true
        type: boolean
      id:
        description: 角色ID
        example: 1
        type: integer
      name:
        description: 角色名称
        example: 超级管理员
        type: string
    type: object
  resp.AdminListPageItem:
    properties:
      address:
        description: 居住地址
        example: xxxxxxx
        type: string
      avatar:
        description: 头像地址
        example: https://cdn.hejunjie.life/avatars/oneadmin.jpeg
        type: string
      createdAt:
        description: 创建时间
        type: string
      email:
        description: email
        example: xxxxx@xxx.com
        type: string
      enable:
        description: 状态
        example: true
        type: boolean
      gender:
        description: 性别
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      id:
        description: 管理员ID
        example: 1
        type: integer
      roles:
        description: 拥有角色列表
        items:
          $ref: '#/definitions/resp.AdminDetailsRoleItem'
        type: array
      updatedAt:
        description: 更新时间
        type: string
      username:
        description: 账号
        example: admin
        type: string
    type: object
  resp.AdminListPageResp:
    properties:
      pageData:
        description: 当前页码数据
        items:
          $ref: '#/definitions/resp.AdminListPageItem'
        type: array
      total:
        description: 总计条数
        example: 100
        type: integer
    type: object
  resp.AdminLoginResp:
    properties:
      accessToken:
        description: access token
        example: Bearer xxxxxxxxxx
        type: string
      refreshToken:
        description: refresh token
        example: Bearer xxxxxxxxxx
        type: string
    type: object
  resp.FollowConfigResp:
    properties:
      content:
        description: 感谢内容
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      requirement:
        description: 感谢门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
    type: object
  resp.GiftConfigResp:
    properties:
      content:
        description: 感谢内容
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      include_blindbox:
        description: 盲盒统计, 0-禁用, 1-启用
        example: "1"
        type: string
      merge_gift:
        description: 礼物合并, 0-禁用, 1-启用
        example: "1"
        type: string
      min_battery:
        description: 起始感谢电池数
        example: "10"
        type: string
      requirement:
        description: 答谢门槛, 0-不限制, 1-带本直播间牌子, 2-带本直播间大航海牌子
        example: "0"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      show_count:
        description: 展示数量, 0-禁用, 1-启用
        example: "1"
        type: string
    type: object
  resp.LiveListenerStatusResp:
    properties:
      attention:
        description: 关注数
        example: 1000
        type: integer
      danmuCount:
        description: 监听到弹幕数量
        example: 1000
        type: integer
      giftCount:
        description: 监听到礼物数量
        example: 50
        type: integer
      isRunning:
