basePath: /
definitions:
  enum.AddressType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - AddressTypeVirtual
    - AddressTypeActual
  enum.BadgeType:
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - BadgeTypeL0
    - BadgeTypeL3
    - BadgeTypeL2
    - BadgeTypeL1
  enum.ChangeType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ChangeTypeReduce
    - ChangeTypeIncrease
  enum.CreditType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - CreditTypeStars
    - CreditTypePoints
  enum.OrderStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - OrderStatusPendingPayment
    - OrderStatusPendingShipment
    - OrderStatusPendingReceipt
    - OrderStatusCompleted
    - OrderStatusCancelled
    - OrderStatusAfterSales
  enum.PayStatus:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - PayStatusUnpaid
    - PayStatusPaid
    - PayStatusRefunded
  enum.ShipStatus:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - ShipStatusPending
    - ShipStatusShipped
    - ShipStatusDelivered
  input.AdConfigReq:
    properties:
      content:
        description: 发送内容（JSON 数组字符串）
        items:
          type: string
        type: array
      enabled:
        description: 是否启用, 0-禁用, 1-启用
        example: "1"
        type: string
      interval:
        description: 发送间隔, 秒
        example: "62"
        type: string
      scene:
        description: 可用场景, 0-不限制, 1-直播中, 2-非直播中
        example: "1"
        type: string
      send_mode:
        description: 发送方式, 0-随机发送, 1-顺序发送
        example: "0"
        type: string
    required:
    - content
    - enabled
    - interval
    - scene
    - send_mode
    type: object
  input.AddressDeleteAddressReq:
    properties:
      id:
        example: 1
        type: integer
    required:
    - id
    type: object
  input.AddressGetAddressByIDReq:
